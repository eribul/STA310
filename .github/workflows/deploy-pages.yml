name: Build and deploy study app to GitHub Pages

# Applies when this whole repository is pushed to GitHub and the Vite app lives
# in the sta310-study/ sub-folder. If you instead push sta310-study/ as its own
# repository, use the workflow in sta310-study/.github/workflows/deploy-pages.yml.

on:
  push:
    branches: [main]
    paths:
      - 'sta310-study/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; keep the newest queued run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sta310-study
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sta310-study/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build the static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: sta310-study/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
